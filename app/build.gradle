plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quiztv.lock'
    compileSdk 34

    defaultConfig {
        applicationId "com.quiztv.lock"
        // 面向老旧电视：Android 5.0 起步
        minSdk 21
        // 故意不追新：targetSdk >28 后，后台服务拉起全屏答题页会被
        // 「后台 Activity 启动限制」拦截，老旧电视反而失效。
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            // 云端暂用 debug 签名，方便直接安装测试；
            // 正式分发请替换为自己的 keystore（见 docs/BUILD.md）。
            signingConfig signingConfigs.debug
        }
    }

    // 旁路安装、不上 Google Play，保留 targetSdk 28 是为兼容老旧电视，
    // 关掉 lint 的上架合规检查，避免 release 构建被拦截。
    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

// 零第三方依赖：org.json、android.app.* 均为系统自带，保证包体最小。
dependencies {
}
