name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASS: ${{ secrets.QUIZTV_STORE_PASS }}
      KEYSTORE_B64: ${{ secrets.QUIZTV_KEYSTORE_BASE64 }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 7.6.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.2'

      - name: Build release APK (unsigned)
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCodeOverride=$VERSION_CODE \
            -PversionNameOverride=$VERSION_NAME

      - name: Sign with private keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "缺少 Secrets，跳过签名（仅未签名产物）"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/quiztv.p12
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          $BUILD_TOOLS/zipalign -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks /tmp/quiztv.p12 --ks-type pkcs12 --ks-pass pass:$STORE_PASS \
            --key-pass pass:$STORE_PASS \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          $BUILD_TOOLS/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk || true
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/quiztvlock-v${VERSION_NAME}.apk
          rm -f app/build/outputs/apk/release/app-release-unsigned.apk \
                app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiztvlock-apk
          path: app/build/outputs/apk/release/quiztvlock-v*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 答题电视锁 v${{ env.VERSION_NAME }}
          body: |
            自动构建发布（Actions run #${{ github.run_number }}）

            - 版本号：v${{ env.VERSION_NAME }}（build ${{ env.VERSION_CODE }}）
            - 固定自有签名，可直接 `adb install -r` 覆盖升级
            - 安装后 WebUI 地址：http://电视IP:36789
          files: app/build/outputs/apk/release/quiztvlock-v${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
